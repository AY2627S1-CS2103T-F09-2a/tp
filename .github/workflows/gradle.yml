name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check coverage

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ui-tests:
    name: JavaFX UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      # The JavaFX tests open real windows, so they need a display and a
      # software renderer on a GPU-less runner. Xvfb supplies the display.
      - name: Run the JavaFX UI tests on a virtual display
        env:
          POCO_UI_TESTS: 'true'
          JAVA_TOOL_OPTIONS: '-Dprism.order=sw'
        run: |
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x1024x24" \
            ./gradlew test coverage

      # Without this step, silently skipped UI tests would still pass.
      - name: Confirm the JavaFX UI tests executed
        run: python3 .github/verify-ui-test-results.py

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload UI test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/test-results/test
