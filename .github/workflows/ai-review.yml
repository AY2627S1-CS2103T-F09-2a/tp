name: AI PR review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        type: number
        required: true
      reasoning_effort:
        description: Reasoning level to use
        type: choice
        options: [low, medium, high, xhigh, max]
        default: high
        required: true
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PR-Agent
        run: pip install 'pr-agent[github] @ git+https://github.com/qodo-ai/pr-agent.git@330f0813b5fe0d1f54b794077c2d02aa85a1fb63' google-auth

      - name: Review PR with bounded batches
        env:
          PR_URL: ${{ github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.repository, inputs.pr_number) }}
          GITHUB__USER_TOKEN: ${{ github.token }}
          OPENAI__API_BASE: ${{ vars.LLM_BASE_URL }}
          OPENAI__KEY: ${{ secrets.LLM_API_KEY }}
          CONFIG__MODEL: openai/${{ vars.LLM_MODEL }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '32000'
          CONFIG__MAX_MODEL_TOKENS: '24192'
          CONFIG__MAX_OUTPUT_TOKENS: '16384'
          CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS: '["x-test-1"]'
          CONFIG__REASONING_EFFORT: ${{ inputs.reasoning_effort || vars.LLM_REASONING_EFFORT || 'high' }}
          CONFIG__AI_TIMEOUT: '280'
          CONFIG__NUM_RETRIES: '0'
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: 'false'
          CONFIG__USE_REPO_SETTINGS_FILE: 'false'
          CONFIG__USE_GLOBAL_SETTINGS_FILE: 'false'
          CONFIG__REPO_CONTEXT_FILES: '[]'
          CONFIG__PROPAGATE_TOOL_ERRORS: 'true'
          CONFIG__PUBLISH_OUTPUT_PROGRESS: 'false'
          CONFIG__OUTPUT_RUN_DETAILS: 'true'
          CONFIG__PATCH_EXTRA_LINES_BEFORE: '0'
          CONFIG__PATCH_EXTRA_LINES_AFTER: '0'
          CONFIG__ALLOW_DYNAMIC_CONTEXT: 'false'
          PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
          PR_REVIEWER__MAX_NUMBER_OF_CALLS: '20'
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: 'false'
          PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY: 'false'
          PR_REVIEWER__ENABLE_REVIEW_LABELS_EFFORT: 'false'
          PR_REVIEWER__PERSISTENT_FINDING_STATE: 'false'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: 'Report concrete bugs only. Keep each finding concise.'
        run: python -m pr_agent.cli --pr_url="$PR_URL" review
